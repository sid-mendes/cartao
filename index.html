<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Sidney Mendes · Sid Up Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--bg2:#111;--bg3:#1a1a1a;--gold:#C9A84C;--text:#fff;--muted:#ffffff;--radius-sm:12px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
.card{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* HEADER */
.header{background:var(--bg2);padding:28px 20px 24px;text-align:center;position:relative}
.logo-top{position:absolute;top:14px;left:14px;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1.5px solid rgba(201,168,76,0.5)}
.logo-top img{width:100%;height:100%;object-fit:cover}
.brand-name{font-size:18px;font-weight:700;letter-spacing:1px;color:#ffffff;margin-bottom:18px;text-align:center}
.avatar{width:120px;height:120px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;margin:0 auto 14px;display:block}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.name{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
.role{font-size:13px;color:var(--gold);font-weight:500;margin-bottom:2px}
.company-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.save-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--gold);color:var(--gold);font-size:12px;font-weight:600;padding:6px 18px;border-radius:20px;background:transparent;cursor:pointer;text-decoration:none;transition:background .15s}
.save-btn:hover{background:rgba(201,168,76,0.1)}

/* ACTIONS */
.actions{display:flex;justify-content:center;gap:32px;background:var(--bg2);padding:0 24px 24px;border-bottom:1px solid #222}
.action-item{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none}
.action-circle{width:52px;height:52px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;transition:background .15s}
.action-item:hover .action-circle{background:rgba(201,168,76,0.12)}
.action-circle svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.action-label{font-size:11px;color:var(--muted);font-weight:500}

/* BODY */
.body{flex:1;background:var(--bg);padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.section-label{text-align:center;font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.social-row{display:flex;justify-content:center;gap:14px}
.social-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .15s;overflow:hidden}
.social-icon:hover{transform:scale(1.07)}

/* INFO CARD */
.info-card{background:var(--bg2);border-radius:var(--radius-sm);border:1px solid #222;overflow:hidden}
.info-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #1e1e1e;text-decoration:none;color:inherit;transition:background .12s}
.info-row:last-child{border-bottom:none}
.info-row:hover{background:#1a1a1a}
.info-icon{width:38px;height:38px;border-radius:9px;background:#1a1a1a;border:1px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.info-label{font-size:11px;color:var(--muted);font-weight:500}
.info-value{font-size:13px;color:var(--gold);font-weight:600;margin-top:2px}

/* GOOGLE BTN */
.google-btn{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--bg2);border:1.5px solid #333;border-radius:24px;padding:12px 20px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;transition:border-color .15s,background .15s}
.google-btn:hover{border-color:var(--gold);background:#1a1a1a}
.google-icon svg{width:18px;height:18px;display:block}

/* FOOTER */
.footer{background:var(--bg2);border-top:1px solid #222;padding:12px 16px}
.bottom-nav{display:flex}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-decoration:none;padding:4px 0}
.nav-item svg{width:22px;height:22px;stroke:#ffffff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.nav-item.active svg{stroke:var(--gold)}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.5px;color:#ffffff;text-transform:uppercase}
.nav-item.active .nav-label{color:var(--gold)}
</style>
</head>
